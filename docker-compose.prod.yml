version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@postgres:5432/isntgram
      DATABASE_SSL: "false"
      JWT_SECRET: change-me
      CORS_ORIGIN: http://localhost:3000
      S3_BUCKET: isntgram-media
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: change-me
      S3_SECRET_ACCESS_KEY: change-me
      S3_PUBLIC_BASE_URL: https://example.com/isntgram-media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      AUTH_SECRET: change-me
      NEXTAUTH_URL: http://localhost:3000
      INTERNAL_API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: isntgram
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d isntgram"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
