name: CI Pipeline

on:
  push:
    branches: [main, develop, development]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main, develop, development]

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  scope:
    name: Select applicable checks
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.changes.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the complete candidate diff
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          paths = subprocess.check_output([
              'git', 'diff', '--name-only', '--no-renames', '-z',
              os.environ['BASE_SHA'], 'HEAD',
          ]).split(b'\0')[:-1]
          docs_only = bool(paths) and all(
              path == b'README.md' or (path.endswith(b'.md') and path.startswith(b'docs/'))
              for path in paths
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"full={str(not docs_only).lower()}\n")
          print('Documentation checks only' if docs_only else 'Full candidate checks')
          PY
      - name: Check documentation whitespace
        if: steps.changes.outputs.full == 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA" HEAD

  # 1. CODE QUALITY - Lint, test, and coverage checks
  quality:
    needs: [scope]
    # A failed scope check falls back to the full gate; drafts allocate no test runner.
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (needs.scope.result != 'success' || needs.scope.outputs.full != 'false')
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 🧰 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧾 Contracts Check
        run: pnpm run contracts:check

      - name: 🔍 Lint & Type Check
        run: |
          pnpm run lint:all
          pnpm run type-check

      - name: 🧪 Unit Tests with Coverage
        run: pnpm test -- --coverage --watchAll=false --coverageReporters=json-summary

      - name: Verify the test launcher in real Node processes
        run: node --test scripts/journey-test-env.test.cjs

      - name: 📦 Archive coverage artifacts
        run: |
          # Create coverage archive with the actual coverage file
          tar -czf coverage-artifacts.tgz coverage/coverage-summary.json

      - name: 📊 Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage-artifacts.tgz
          retention-days: 14

      - name: 📄 Upload JUnit
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: test-results/junit/jest-junit.xml
          retention-days: 14

  # Coverage enforcement with deterministic paths
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: [quality]
    if: ${{ !cancelled() && needs.quality.result == 'success' }}
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 🧰 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📥 Download Coverage
        uses: actions/download-artifact@v5
        with:
          name: coverage
          path: .

      - name: 📦 Extract Coverage
        run: |
          # Extract coverage file
          tar -xzf coverage-artifacts.tgz

          # Verify coverage file exists
          echo "Verifying coverage file..."
          ls -la coverage/coverage-summary.json

      - name: 📈 Enforce Coverage Thresholds
        run: pnpm run coverage:report

  # 2. INTEGRATION - Build and integration tests
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [quality]
    if: ${{ !cancelled() && needs.quality.result == 'success' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: isntgram_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/isntgram_test
      NODE_ENV: ci
      ISNTGRAM_TEST_POSTGRES: "1"
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 🧰 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ♻️ Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key:
            next-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/package.json',
            'apps/web/next.config.mjs') }}
          restore-keys: |
            next-cache-${{ runner.os }}-

      - name: 🧱 Build Applications
        run: pnpm run build:all

      - name: 🔗 Integration Tests
        run: pnpm run test:integration -- --runInBand --watchAll=false

      - name: 📄 Upload Integration JUnit
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: test-results/junit/jest-junit.xml
          retention-days: 14

  # 3. E2E TESTS - End-to-end testing
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [integration]
    if: ${{ !cancelled() && needs.integration.result == 'success' }}
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 🧰 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: ♻️ Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key:
            next-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/package.json',
            'apps/web/next.config.mjs') }}
          restore-keys: |
            next-cache-${{ runner.os }}-

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧱 Build Applications
        run: pnpm run build:all

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        if: steps.cache-playwright.outputs.cache-hit != 'true'

      - name: Start disposable photo storage
        run: |
          curl --fail --location --retry 3 https://github.com/seaweedfs/seaweedfs/releases/download/4.45/linux_amd64.tar.gz -o "$RUNNER_TEMP/seaweedfs.tar.gz"
          echo "c408894668aeaa74d4f251e20b350fd72195cbe596ddc3f48658709714f7be36  $RUNNER_TEMP/seaweedfs.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/seaweedfs-bin"
          tar -xzf "$RUNNER_TEMP/seaweedfs.tar.gz" -C "$RUNNER_TEMP/seaweedfs-bin" weed
          E2E_WEED_BIN="$RUNNER_TEMP/seaweedfs-bin/weed" bash scripts/e2e-storage.sh > "$RUNNER_TEMP/e2e-storage.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/e2e-storage.pid"
          node apps/api/scripts/bootstrap-e2e-storage.cjs

      - name: 🌐 E2E Tests
        run: pnpm run test:e2e

      - name: 📊 Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop disposable photo storage
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/e2e-storage.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/e2e-storage.pid")" || true
          fi

  # 4. PRODUCTION BUILD - Container build and security
  production-build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [integration]
    if: ${{ !cancelled() && needs.integration.result == 'success' }}
    permissions:
      contents: read
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build API Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          push: false
          tags: isntgram-ai-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔍 Trivy API Image Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: isntgram-ai-api:${{ github.sha }}
          format: "table"
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true

      - name: 🐳 Build Web Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: isntgram-ai-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔍 Trivy Web Image Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: isntgram-ai-web:${{ github.sha }}
          format: "table"
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true

      - name: 📋 Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-xml
          output-file: sbom.xml

      - name: 📤 Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.xml

  # 5. SECURITY - Code security scans (runs in parallel with E2E and Production Build)
  security:
    if: github.event.action != 'converted_to_draft'
    name: Security Scans
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 🧰 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: 🔍 CodeQL Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: 🔍 CodeQL Analyze
        uses: github/codeql-action/analyze@v3

      - name: 🔍 Gitleaks Secrets Scan
        run: |
          GL_VERSION=8.24.3
          curl -sSL -o gitleaks.tar.gz https://github.com/zricethezav/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks detect --redact --no-git --config=.gitleaks.toml --report-format=sarif --report-path=gitleaks.sarif

      - name: 📤 Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
