name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: ci
  CI: true

jobs:
  # 1. CODE QUALITY - Lint, test, and coverage checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    environment: Test
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: |
          # Add retry mechanism for pnpm install
          for i in 1 2 3; do
            echo "Attempt $i: Installing dependencies..."
            if pnpm install --frozen-lockfile; then
              echo "✅ Dependencies installed successfully"
              break
            else
              echo "❌ Attempt $i failed"
              if [ $i -eq 3 ]; then
                echo "💥 All attempts failed"
                exit 1
              fi
              echo "⏳ Waiting 30 seconds before retry..."
              sleep 30
            fi
          done

      - name: 🔍 Lint & Type Check
        run: |
          pnpm run lint:all
          pnpm run type-check
          pnpm run openapi:check

      - name: 🧪 Unit Tests with Coverage
        run: pnpm test --coverage --watchAll=false --coverageReporters=json-summary

      - name: 📦 Archive coverage artifacts
        run: |
          # Create coverage archive with the actual coverage file
          tar -czf coverage-artifacts.tgz coverage/coverage-summary.json

      - name: 📊 Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage-artifacts.tgz
          retention-days: 14

      - name: 📄 Upload JUnit
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: test-results/junit/jest-junit.xml
          retention-days: 14

  # Coverage enforcement with deterministic paths
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: [quality]
    environment: Test
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: |
          # Add retry mechanism for pnpm install
          for i in 1 2 3; do
            echo "Attempt $i: Installing dependencies..."
            if pnpm install --frozen-lockfile; then
              echo "✅ Dependencies installed successfully"
              break
            else
              echo "❌ Attempt $i failed"
              if [ $i -eq 3 ]; then
                echo "💥 All attempts failed"
                exit 1
              fi
              echo "⏳ Waiting 30 seconds before retry..."
              sleep 30
            fi
          done

      - name: 📥 Download Coverage
        uses: actions/download-artifact@v5
        with:
          name: coverage
          path: .

      - name: 📦 Extract Coverage
        run: |
          # Extract coverage file
          tar -xzf coverage-artifacts.tgz

          # Verify coverage file exists
          echo "Verifying coverage file..."
          ls -la coverage/coverage-summary.json

      - name: 📈 Enforce Coverage Thresholds
        run: pnpm run coverage:report

  # 2. INTEGRATION - Build and integration tests
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [quality]
    environment: Test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: isntgram_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/isntgram_test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: isntgram_test
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: |
          # Add retry mechanism for pnpm install
          for i in 1 2 3; do
            echo "Attempt $i: Installing dependencies..."
            if pnpm install --frozen-lockfile; then
              echo "✅ Dependencies installed successfully"
              break
            else
              echo "❌ Attempt $i failed"
              if [ $i -eq 3 ]; then
                echo "💥 All attempts failed"
                exit 1
              fi
              echo "⏳ Waiting 30 seconds before retry..."
              sleep 30
            fi
          done

      - name: ♻️ Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key:
            next-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/package.json',
            'apps/web/next.config.mjs') }}
          restore-keys: |
            next-cache-${{ runner.os }}-

      - name: 🧱 Build Applications
        run: pnpm run build:all

      - name: 🔗 Integration Tests
        run: pnpm run test:integration --runInBand --watchAll=false

      - name: 📄 Upload Integration JUnit
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: test-results/junit/jest-junit.xml
          retention-days: 14

  # 3. E2E TESTS - End-to-end testing
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [integration]
    environment: Test
    env:
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      AUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NEXT_PUBLIC_DEMO_EMAIL: ${{ secrets.NEXT_PUBLIC_DEMO_EMAIL }}
      NEXT_PUBLIC_DEMO_PASSWORD: ${{ secrets.NEXT_PUBLIC_DEMO_PASSWORD }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NODE_ENV: ${{ vars.NODE_ENV }}
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: "pnpm"

      - name: ♻️ Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key:
            next-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/package.json',
            'apps/web/next.config.mjs') }}
          restore-keys: |
            next-cache-${{ runner.os }}-

      - name: 📦 Install dependencies
        run: |
          # Add retry mechanism for pnpm install
          for i in 1 2 3; do
            echo "Attempt $i: Installing dependencies..."
            if pnpm install --frozen-lockfile; then
              echo "✅ Dependencies installed successfully"
              break
            else
              echo "❌ Attempt $i failed"
              if [ $i -eq 3 ]; then
                echo "💥 All attempts failed"
                exit 1
              fi
              echo "⏳ Waiting 30 seconds before retry..."
              sleep 30
            fi
          done

      - name: 🧱 Build Applications
        run: pnpm run build:all

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        if: steps.cache-playwright.outputs.cache-hit != 'true'

      - name: 🌐 E2E Tests
        run: pnpm run test:e2e

      - name: 📊 Upload Playwright Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # 4. PRODUCTION BUILD - Container build and security
  production-build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [integration]
    environment: Test
    permissions:
      contents: read
      packages: write
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and Push Production Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}
            ghcr.io/${{ github.repository }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: 🐳 Build and Push Production Web Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}
            ghcr.io/${{ github.repository }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: 🔍 Trivy Container Scan (API)
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ghcr.io/${{ github.repository }}-api:${{ github.sha }}
          format: "table"
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true

      - name: 🔍 Trivy Container Scan (Web)
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ghcr.io/${{ github.repository }}-web:${{ github.sha }}
          format: "table"
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true

      - name: 📋 Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-xml
          output-file: sbom.xml

      - name: 📤 Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.xml

  # 5. SECURITY - Code security scans (runs in parallel with E2E and Production Build)
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    needs: [quality]
    environment: Test
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: |
          # Add retry mechanism for pnpm install
          for i in 1 2 3; do
            echo "Attempt $i: Installing dependencies..."
            if pnpm install --frozen-lockfile; then
              echo "✅ Dependencies installed successfully"
              break
            else
              echo "❌ Attempt $i failed"
              if [ $i -eq 3 ]; then
                echo "💥 All attempts failed"
                exit 1
              fi
              echo "⏳ Waiting 30 seconds before retry..."
              sleep 30
            fi
          done

      - name: 🔍 CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: 🔍 CodeQL Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: 🔍 CodeQL Analyze
        uses: github/codeql-action/analyze@v3

      - name: 🔍 Gitleaks Secrets Scan
        run: |
          GL_VERSION=8.24.3
          curl -sSL -o gitleaks.tar.gz https://github.com/zricethezav/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks detect --redact --no-git --config=.gitleaks.toml --report-format=sarif --report-path=gitleaks.sarif

      - name: 📤 Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

  # 6. DEPLOYMENT - Optional VM deploy (requires secrets)
  deploy:
    name: Deploy (VM)
    runs-on: ubuntu-latest
    needs: [production-build]
    environment: Production
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      secrets.DEPLOY_HOST != '' &&
      secrets.DEPLOY_USER != '' &&
      secrets.DEPLOY_SSH_KEY != '' &&
      secrets.DEPLOY_PATH != '' &&
      secrets.GHCR_USERNAME != '' &&
      secrets.GHCR_TOKEN != ''
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: 📦 Upload deployment config
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_rsa "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p '${{ secrets.DEPLOY_PATH }}/docker/caddy'"
          scp -i ~/.ssh/id_rsa docker-compose.deploy.yml "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/docker-compose.deploy.yml"
          scp -i ~/.ssh/id_rsa docker/caddy/Caddyfile "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/docker/caddy/Caddyfile"

      - name: 🚢 Deploy
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_rsa "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" <<'EOF'
          set -euo pipefail
          cd "${{ secrets.DEPLOY_PATH }}"

          export GITHUB_REPOSITORY="${{ github.repository }}"
          export IMAGE_TAG="${{ github.sha }}"

          docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" -p "${{ secrets.GHCR_TOKEN }}"

          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml run --rm api-migrate
          docker compose -f docker-compose.deploy.yml up -d --remove-orphans

          # Smoke checks (internal container health endpoints)
          docker compose -f docker-compose.deploy.yml exec -T api node -e "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok) throw new Error('api health failed');}).catch(e=>{console.error(e);process.exit(1)})"
          docker compose -f docker-compose.deploy.yml exec -T web node -e "fetch('http://localhost:3000/health').then(r=>{if(!r.ok) throw new Error('web health failed');}).catch(e=>{console.error(e);process.exit(1)})"
          EOF
